<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Java Problem Solving Portfolio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary-container": "#238636",
                    "on-surface-variant": "#becaba",
                    "on-background": "#dde3e9",
                    "surface-tint": "#7bdb80",
                    "outline-variant": "#3f4a3d",
                    "background": "#0e1418",
                    "surface": "#0e1418",
                    "surface-container-highest": "#2f363a",
                    "surface-container": "#1a2025",
                    "primary": "#7bdb80",
                    "on-surface": "#dde3e9",
                },
                spacing: {
                    "stack-sm": "8px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "gutter": "24px",
                },
                fontFamily: {
                    "display-lg": ["Inter"],
                    "code-sm": ["JetBrains Mono"],
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                },
                fontSize: {
                    "display-lg": ["64px", { lineHeight: "1.1", letterSpacing: "-0.04em", fontWeight: "800" }],
                    "code-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
                    "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                    "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" }],
                },
                keyframes: {
                    pulseBar: {
                        '0%, 100%': { opacity: '1' },
                        '50%': { opacity: '.6' },
                    },
                    float: {
                        '0%, 100%': { transform: 'translateY(0) rotate(0)' },
                        '50%': { transform: 'translateY(-10px) rotate(2deg)' },
                    }
                },
                animation: {
                    'pulse-bar': 'pulseBar 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    'float-slow': 'float 6s ease-in-out infinite',
                    'float-medium': 'float 4s ease-in-out infinite',
                }
            }
        }
    }
</script>
<style>
    .hero-bg {
        background-color: #0d1117;
    }
    .text-glow {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
    .icon-glow {
        filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
    }
    .glass-panel {
        background: rgba(22, 27, 34, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(48, 54, 61, 0.5);
    }
</style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-8">
<!-- 1200x400px Hero Banner Container -->
<div class="relative w-full max-w-[1200px] h-[400px] rounded-xl overflow-hidden hero-bg flex flex-col justify-between border border-outline-variant/30 shadow-2xl">
<!-- Background Animation Layer -->
<div class="absolute inset-0 w-full h-full z-0 opacity-60" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container');
  const width = container.clientWidth || 1200;
  const height = container.clientHeight || 400;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  // Particle system for blue 'cold' steam
  const particleCount = 120;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 0.6;
      positions[i * 3 + 1] = Math.random() * 2;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 0.6;
      velocities[i] = 0.008 + Math.random() * 0.015;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
      color: 0x3b82f6,
      size: 0.04,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
  });

  const particles = new THREE.Points(geometry, material);
  particles.position.y = -0.5;
  scene.add(particles);

  const group = new THREE.Group();
  scene.add(group);

  function createFloatingElement(color) {
      const geom = new THREE.IcosahedronGeometry(0.1, 0);
      const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.3 });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 2);
      mesh.userData = { speed: 0.003 + Math.random() * 0.008 };
      return mesh;
  }

  const elements = [];
  for(let i=0; i<12; i++) {
      const el = createFloatingElement(i % 2 === 0 ? 0xffffff : 0x60a5fa);
      group.add(el);
      elements.push(el);
  }

  function animate() {
      requestAnimationFrame(animate);
      
      const posAttr = particles.geometry.attributes.position;
      for (let i = 0; i < particleCount; i++) {
          posAttr.array[i * 3 + 1] += velocities[i];
          posAttr.array[i * 3] += Math.sin(Date.now() * 0.0008 + i) * 0.0015;
          
          if (posAttr.array[i * 3 + 1] > 2) {
              posAttr.array[i * 3 + 1] = 0;
              posAttr.array[i * 3] = (Math.random() - 0.5) * 0.6;
          }
      }
      posAttr.needsUpdate = true;

      elements.forEach(el => {
          el.position.y += Math.sin(Date.now() * 0.0005 * el.userData.speed) * 0.008;
          el.rotation.x += 0.005;
          el.rotation.y += 0.005;
      });

      renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
  });

  animate();
})();
</script>
</div>
<!-- Floating Elements -->
<div class="absolute inset-0 z-10 pointer-events-none overflow-hidden">
<div class="absolute top-1/4 left-[15%] text-blue-500/40 font-code-sm text-3xl animate-float-slow select-none">{ }</div>
<div class="absolute bottom-1/3 right-[20%] text-blue-400/30 font-code-sm text-4xl animate-float-medium select-none">;</div>
<div class="absolute top-[20%] right-[10%] text-blue-300/20 font-code-sm text-5xl animate-float-slow select-none">&lt;/&gt;</div>
<span class="material-symbols-outlined absolute bottom-1/4 left-[10%] text-blue-500/30 text-[40px] animate-float-medium select-none" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Main Content Area -->
<div class="relative z-20 flex-grow flex flex-col items-center justify-center px-gutter text-center">
<div class="mb-stack-md icon-glow">
<span class="material-symbols-outlined text-[64px] text-blue-500" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                    coffee
                </span>
</div>
<h1 class="font-display-lg text-display-lg text-white text-glow mb-stack-sm max-w-[900px] leading-tight">
                Java Problem Solving Portfolio
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[600px] mt-stack-sm">
                A highly curated collection of algorithmic solutions and backend architecture.
            </p>
</div>
<!-- Bottom Progress Bar Section -->
<div class="relative z-20 w-full px-gutter pb-stack-lg pt-stack-md glass-panel mt-auto">
<div class="flex justify-between items-end mb-stack-sm max-w-[800px] mx-auto w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">Progress</span>
<span class="font-code-sm text-code-sm text-primary font-bold">3 Solved</span>
</div>
<div class="w-full max-w-[800px] mx-auto h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[70%] rounded-full animate-pulse-bar shadow-[0_0_10px_rgba(35,134,54,0.5)]"></div>
</div>
</div>
</div>
</body></html>
